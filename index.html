    <style id="app-boot-styles">
      html.app-boot-loading,
      html.app-boot-loading body {
        overflow: hidden !important;
        height: 100% !important;
      }

      #app-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background-color: #fdf9f4;
        color: #1c1c19;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        opacity: 1;
        transition: opacity 250ms ease;
        overflow: hidden;
      }

      #app-boot-loader.is-fading {
        opacity: 0;
        pointer-events: none;
      }

      .ceda-boot-skeleton {
        position: absolute;
        inset: 0;
        opacity: 0.55;
        display: flex;
        flex-direction: column;
        pointer-events: none;
        user-select: none;
      }

      .ceda-sk-block {
        background: linear-gradient(90deg, #e5ded6 25%, #f2ece5 50%, #e5ded6 75%);
        background-size: 200% 100%;
        animation: cedaBootShimmer 1.6s ease-in-out infinite;
        border-radius: 8px;
      }

      .ceda-sk-header {
        height: 80px;
        border-bottom: 1px solid #e6ded5;
        background-color: #fbf7f1;
        flex-shrink: 0;
      }

      .ceda-sk-container {
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
        padding: 0 24px;
        box-sizing: border-box;
      }

      .ceda-sk-header-inner {
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .ceda-sk-header-left {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .ceda-sk-nav {
        display: none;
        align-items: center;
        gap: 12px;
      }

      .ceda-sk-hero {
        background-color: #f3ede6;
        padding: 48px 0;
        border-bottom: 1px solid #e6ded5;
      }

      .ceda-sk-hero-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 32px;
        align-items: center;
      }

      .ceda-sk-hero-left {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .ceda-sk-hero-card {
        background-color: #ebe4dc;
        border-radius: 16px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .ceda-sk-stats {
        background-color: #f7f3ee;
        padding: 36px 0;
        border-bottom: 1px solid #e6ded5;
      }

      .ceda-sk-stats-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .ceda-sk-stat-card {
        background-color: #ffffff;
        border: 1px solid #ebe4dc;
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .ceda-sk-cards {
        padding: 40px 0;
      }

      .ceda-sk-cards-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .ceda-sk-content-card {
        background-color: #ffffff;
        border: 1px solid #ebe4dc;
        border-radius: 12px;
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .ceda-boot-center {
        position: relative;
        z-index: 2;
        height: 100%;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }

      .ceda-boot-badge {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 24px 32px;
        border-radius: 16px;
        background: rgba(253, 249, 244, 0.92);
        box-shadow: 0 10px 30px rgba(62, 42, 37, 0.08);
        border: 1px solid rgba(226, 191, 184, 0.55);
      }

      .ceda-boot-spinner {
        width: 40px;
        height: 40px;
        border-radius: 9999px;
        border: 3.5px solid rgba(124, 7, 0, 0.16);
        border-top-color: #a02010;
        animation: cedaBootSpin 0.85s linear infinite;
      }

      .ceda-boot-label {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #7c0700;
        text-align: center;
      }

      @media (min-width: 640px) {
        .ceda-sk-stats-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .ceda-sk-cards-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (min-width: 1024px) {
        .ceda-sk-nav {
          display: flex;
        }
        .ceda-sk-hero-grid {
          grid-template-columns: 7fr 5fr;
        }
        .ceda-sk-stats-grid {
          grid-template-columns: repeat(4, 1fr);
        }
        .ceda-sk-cards-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      @keyframes cedaBootShimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      @keyframes cedaBootSpin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-boot-loader {
          transition-duration: 1ms;
        }
        .ceda-sk-block {
          animation: none;
          background: #e5ded6;
        }
        .ceda-boot-spinner {
          animation: cedaBootSpin 6s linear infinite;
        }
      }
    </style>
    <script>
